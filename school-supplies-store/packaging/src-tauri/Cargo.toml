[package]
name = "maktabati-private"
version = "0.1.0"
description = "Private testing wrapper for Maktabati"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "maktabati_private_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2"

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
